# IP virtual host for the Hong Kong deployment. Existing named sites stay separate.
server {
    listen 80;
    listen [::]:80;
    server_name 207.57.127.105;

    # Preserve the IP root's existing static-site behavior.
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;
    access_log /var/log/nginx/lucen-image.access.log main;
    error_log /var/log/nginx/lucen-image.error.log warn;

    location = /generate-image {
        return 308 /generate-image/$is_args$args;
    }

    location ^~ /generate-image/ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        # Keep JSON Content-Length intact; compress static scripts/styles only.
        gzip_types application/javascript text/css;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
