server {
    listen 80;
    listen [::]:80;
    server_name rebirth-global-mall.985211520.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rebirth-global-mall.985211520.xyz;

    ssl_certificate /etc/letsencrypt/live/rebirth-global-mall.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rebirth-global-mall.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/lucen-image.access.log;
    error_log /var/log/nginx/lucen-image.error.log;
    client_max_body_size 100m;

    location / {
        proxy_pass http://100.119.100.113:18787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
