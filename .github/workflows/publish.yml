name: Publish npm Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --check lucen-auth.cjs && node --check lucen-local-proxy.cjs && node --check local-media.cjs
      - run: npm run verify:auth
      - run: npm run verify:storage
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: lucen-image-workbench-npm
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 30
